  <line x1="60" y1="30" x2="60" y2="17" stroke="#1B2A50" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="11" r="5.5" fill="#CB3A2E"/>
  <!-- arms -->
  <rect x="13" y="58" width="12" height="27" rx="6" fill="#1B2A50"/>
  <rect x="95" y="58" width="12" height="27" rx="6" fill="#1B2A50"/>
  <!-- body / head -->
  <rect x="26" y="30" width="68" height="66" rx="22" fill="#1B2A50"/>
  <!-- eyes = "1 1" -->
  <rect x="48" y="49" width="7" height="25" rx="3.5" fill="#F6F7F9"/>
  <rect x="65" y="49" width="7" height="25" rx="3.5" fill="#F6F7F9"/>
  <!-- smile -->
  <path d="M48 83 Q60 93 72 83" stroke="#F6F7F9" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- feet -->
  <rect x="40" y="96" width="13" height="9" rx="4.5" fill="#1B2A50"/>
  <rect x="67" y="96" width="13" height="9" rx="4.5" fill="#1B2A50"/>
